version: '3.8'

services:
  web:
    build:
      context: .
      dockerfile: Dockerfile
    image: nexus-shield-view:latest
    container_name: nexus-shield-container
    ports:
      - "8080:80"
    restart: always
    environment:
      - NODE_ENV=production
    networks:
      - app-network

networks:
  app-network:
    driver: bridge
